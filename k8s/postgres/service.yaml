apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: order-system
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
  # ClusterIP — postgres is only accessible inside the cluster
  # The app reaches it via postgres.order-system.svc.cluster.local:5432
  type: ClusterIP
