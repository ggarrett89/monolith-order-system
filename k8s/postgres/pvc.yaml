apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: order-system
spec:
  accessModes:
    - ReadWriteOnce        # One node can mount read-write at a time — correct for PostgreSQL
  resources:
    requests:
      storage: 2Gi
  # No storageClassName → uses cluster default StorageClass
  # On this kubeadm cluster that is the local-path provisioner or hostPath
