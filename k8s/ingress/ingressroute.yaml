# Traefik IngressRoute — routes all traffic on port 80 to orders-app
# Requires Traefik installed with the Kubernetes CRD provider (default in Helm chart)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: orders-app
  namespace: order-system
spec:
  entryPoints:
    - web          # Traefik's HTTP entrypoint (port 80)
  routes:
    - match: PathPrefix(`/`)
      kind: Rule
      services:
        - name: orders-app
          port: 80
